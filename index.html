<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Tracker</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Animate.css -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link href="style.css" rel="stylesheet" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-4">💪 Fitness Tracker</span>
    <span id="today-date" class="text-white-50 small"></span>
  </nav>

  <div class="container py-4">

    <!-- STATS ROW -->
    <div class="row g-3 mb-4 animate__animated animate__fadeInDown">
      <div class="col-6 col-md-3">
        <div class="stat-card text-center p-3">
          <div class="stat-number" id="total-workouts">0</div>
          <div class="stat-label">Total Workouts</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card text-center p-3">
          <div class="stat-number" id="today-count">0</div>
          <div class="stat-label">Today</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card text-center p-3">
          <div class="stat-number" id="total-sets">0</div>
          <div class="stat-label">Total Sets</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card text-center p-3">
          <div class="stat-number" id="total-reps">0</div>
          <div class="stat-label">Total Reps</div>
        </div>
      </div>
    </div>

    <!-- ADD WORKOUT FORM -->
    <div class="form-card p-4 mb-4 animate__animated animate__fadeInUp">
      <h5 class="mb-3 fw-bold">Add Workout</h5>
      <div class="row g-2">
        <div class="col-12 col-md-4">
          <input type="text" id="exercise" class="form-control custom-input" placeholder="Exercise (e.g. Push Ups)" />
        </div>
        <div class="col-6 col-md-2">
          <input type="number" id="sets" class="form-control custom-input" placeholder="Sets" min="1" />
        </div>
        <div class="col-6 col-md-2">
          <input type="number" id="reps" class="form-control custom-input" placeholder="Reps" min="1" />
        </div>
        <div class="col-12 col-md-2">
          <input type="number" id="weight" class="form-control custom-input" placeholder="Weight (kg)" min="0" />
        </div>
        <div class="col-12 col-md-2">
          <button class="btn btn-primary w-100 fw-bold" onclick="addWorkout()">Add</button>
        </div>
      </div>
      <div id="form-error" class="text-danger mt-2 small"></div>
    </div>

    <!-- FILTER BAR -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">Workout Log</h5>
      <div class="d-flex gap-2">
        <select id="filter-date" class="form-select form-select-sm custom-input" style="width:auto" onchange="renderWorkouts()">
          <option value="all">All Days</option>
          <option value="today">Today</option>
        </select>
        <button class="btn btn-sm btn-outline-danger" onclick="clearAll()">Clear All</button>
      </div>
    </div>

    <!-- WORKOUT LIST -->
    <div id="workout-list"></div>

    <!-- EMPTY STATE -->
    <div id="empty-state" class="text-center py-5 animate__animated animate__fadeIn">
      <div class="empty-icon">🏋️</div>
      <p class="text-white-50 mt-2">No workouts yet. Add your first one above!</p>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
