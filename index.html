<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-4">💪 Fitness Tracker</span>
    <span id="today-date" class="text-white-50 small"></span>
  </nav>

  <!-- HERO BANNER WITH ANIMATED HUMAN -->
  <div class="hero-banner animate__animated animate__fadeIn">
    <div class="hero-text">
      <h2>Log Your Gains 💪</h2>
      <p>Track every set, every rep, every day. Stay consistent and grow.</p>
    </div>
    <div class="hero-figure">
      <svg width="160" height="200" viewBox="0 0 160 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <style>
          @keyframes ftLift  { 0%,100%{transform:translateY(0)}   50%{transform:translateY(-14px)} }
          @keyframes ftSquat { 0%,100%{transform:translateY(0)}   50%{transform:translateY(8px)}  }
          @keyframes ftGlow  { 0%,100%{opacity:0.2} 50%{opacity:0.6} }
          .ft-bar  { animation: ftLift  1.8s ease-in-out infinite; }
          .ft-body { animation: ftSquat 1.8s ease-in-out infinite; }
          .ft-glow { animation: ftGlow  1.8s ease-in-out infinite; }
        </style>
        <!-- Shadow glow -->
        <ellipse class="ft-glow" cx="80" cy="190" rx="42" ry="8" fill="#3b82f6"/>
        <!-- BARBELL (lifts up and down) -->
        <g class="ft-bar">
          <rect x="18" y="56" width="124" height="7" rx="3.5" fill="#ffffff"/>
          <rect x="10" y="47" width="16" height="24" rx="5" fill="#ffffff" opacity="0.75"/>
          <rect x="134" y="47" width="16" height="24" rx="5" fill="#ffffff" opacity="0.75"/>
          <rect x="4"  y="53" width="10" height="14" rx="4" fill="#ffffff" opacity="0.45"/>
          <rect x="146" y="53" width="10" height="14" rx="4" fill="#ffffff" opacity="0.45"/>
        </g>
        <!-- BODY (squats in sync) -->
        <g class="ft-body">
          <!-- Head -->
          <circle cx="80" cy="94" r="17" fill="#f0d0a0"/>
          <!-- Eyes -->
          <circle cx="74" cy="91" r="2.5" fill="#333"/>
          <circle cx="86" cy="91" r="2.5" fill="#333"/>
          <!-- Smile -->
          <path d="M74 99 Q80 105 86 99" stroke="#333" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <!-- Hair -->
          <path d="M63 88 Q80 70 97 88" stroke="#4a3728" stroke-width="5" fill="none" stroke-linecap="round"/>
          <!-- Sweat drop -->
          <ellipse cx="97" cy="96" rx="3" ry="4.5" fill="#7ec8e3" opacity="0.7" transform="rotate(-15 97 96)"/>
          <!-- Neck -->
          <rect x="75" y="109" width="10" height="12" rx="4" fill="#f0d0a0"/>
          <!-- Torso -->
          <rect x="56" y="119" width="48" height="50" rx="10" fill="#1a2e4a"/>
          <!-- Shirt stripe -->
          <path d="M68 132 L80 143 L92 132" stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none"/>
          <!-- Left arm -->
          <line x1="56" y1="127" x2="22" y2="82" stroke="#f0d0a0" stroke-width="9" stroke-linecap="round"/>
          <circle cx="22" cy="80" r="7" fill="#f0d0a0"/>
          <!-- Right arm -->
          <line x1="104" y1="127" x2="138" y2="82" stroke="#f0d0a0" stroke-width="9" stroke-linecap="round"/>
          <circle cx="138" cy="80" r="7" fill="#f0d0a0"/>
          <!-- Shorts -->
          <rect x="58" y="165" width="44" height="22" rx="7" fill="#0f172a"/>
          <!-- Left leg -->
          <line x1="69"  y1="185" x2="62"  y2="194" stroke="#f0d0a0" stroke-width="9" stroke-linecap="round"/>
          <rect x="54"  y="190" width="20" height="9" rx="4.5" fill="#333"/>
          <!-- Right leg -->
          <line x1="91"  y1="185" x2="98"  y2="194" stroke="#f0d0a0" stroke-width="9" stroke-linecap="round"/>
          <rect x="86"  y="190" width="20" height="9" rx="4.5" fill="#333"/>
        </g>
        <!-- Effort lines -->
        <g stroke="#ffffff" stroke-width="1.5" opacity="0.25" stroke-linecap="round">
          <line x1="24" y1="66" x2="14" y2="54"/>
          <line x1="20" y1="72" x2="8"  y2="68"/>
          <line x1="136" y1="66" x2="146" y2="54"/>
          <line x1="140" y1="72" x2="152" y2="68"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="container py-4">

    <div class="row g-3 mb-4 animate__animated animate__fadeInDown">
      <div class="col-6 col-md-3">
        <div class="stat-card text-center p-3">
          <div class="stat-number" id="total-workouts">0</div>
          <div class="stat-label">Total Workouts</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card text-center p-3">
          <div class="stat-number" id="today-count">0</div>
          <div class="stat-label">Today</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card text-center p-3">
          <div class="stat-number" id="total-sets">0</div>
          <div class="stat-label">Total Sets</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card text-center p-3">
          <div class="stat-number" id="total-reps">0</div>
          <div class="stat-label">Total Reps</div>
        </div>
      </div>
    </div>

    <div class="form-card p-4 mb-4 animate__animated animate__fadeInUp">
      <h5 class="mb-3 fw-bold">Add Workout</h5>
      <div class="row g-2">
        <div class="col-12 col-md-4">
          <input type="text" id="exercise" class="form-control custom-input" placeholder="Exercise (e.g. Push Ups)" />
        </div>
        <div class="col-6 col-md-2">
          <input type="number" id="sets" class="form-control custom-input" placeholder="Sets" min="1" />
        </div>
        <div class="col-6 col-md-2">
          <input type="number" id="reps" class="form-control custom-input" placeholder="Reps" min="1" />
        </div>
        <div class="col-12 col-md-2">
          <input type="number" id="weight" class="form-control custom-input" placeholder="Weight (kg)" min="0" />
        </div>
        <div class="col-12 col-md-2">
          <button class="btn btn-primary w-100 fw-bold" onclick="addWorkout()">Add</button>
        </div>
      </div>
      <div id="form-error" class="text-danger mt-2 small"></div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0">Workout Log</h5>
      <div class="d-flex gap-2">
        <select id="filter-date" class="form-select form-select-sm custom-input" style="width:auto" onchange="renderWorkouts()">
          <option value="all">All Days</option>
          <option value="today">Today</option>
        </select>
        <button class="btn btn-sm btn-outline-danger" onclick="clearAll()">Clear All</button>
      </div>
    </div>

    <div id="workout-list"></div>

    <div id="empty-state" class="text-center py-5 animate__animated animate__fadeIn">
      <div class="empty-icon">🏋️</div>
      <p class="text-white-50 mt-2">No workouts yet. Add your first one above!</p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
